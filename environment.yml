# Base conda environment for wildfire-refactored.
#
# PyTorch is installed via pip (in the pip: section below) because its build
# depends on your CUDA / CPU target. By default this installs CPU wheels;
# for a GPU build see the comment next to the torch packages and the README.
#
# Optional GRIB backend overlay (apply one after creating the base env):
#   conda env update -n wildfore-r -f environments/environment.local-pygrib.yml  # pygrib
#   conda env update -n wildfore-r -f environments/environment.hpc-cfgrib.yml    # cfgrib
#
# NOTE: channel_priority: strict keeps conda-forge and defaults from mixing
# GDAL/rasterio binaries, which can cause silent crashes (especially on Windows).
name: wildfore-r
channels:
  - conda-forge
  - defaults
channel_priority: strict
dependencies:
  - python=3.11

  # Core scientific stack
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib

  # Geospatial / raster
  - rasterio
  - geopandas
  - pyproj
  - xarray
  - netCDF4
  - pillow

  # Data download
  - cdsapi
  - ecmwf-api-client
  - requests
  - boto3        # AWS S3 access (used by s3fs for GOES GLM)
  - s3fs         # S3 filesystem interface (GOES-16/17/18 GLM lightning)
  - earthaccess  # NASA Earthdata unified download (MODIS NDVI + SRTM slope)
  - pyhdf        # HDF4 reader (MODIS MOD13A2 format)

  # Utilities / dev
  - pyyaml
  - tqdm
  - psutil
  - pytest

  - pip
  - pip:
    # PyTorch. Plain pip installs a CPU wheel from PyPI; for a GPU build,
    # instead run (after creating the env):
    #   pip install torch --index-url https://download.pytorch.org/whl/cu124
    # (torchvision / torchaudio are not used by this codebase.)
    - torch
