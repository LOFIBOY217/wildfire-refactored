# Base conda environment for wildfire-refactored.
#
# Versions below are pinned to the set verified working on the training cluster
# (Python 3.11 pip venv). They are known to be mutually compatible. If the conda
# solver cannot satisfy an exact pin (a build may be missing on conda-forge),
# relax that single line to a lower bound, e.g. `numpy>=1.26,<2`.
#
# PyTorch is installed via pip (its build depends on your CUDA / CPU target).
# Plain pip gives CPU wheels; for a GPU build see the pip: section and the README.
#
# Optional GRIB backend overlay (apply one after creating the base env):
#   conda env update -n wildfore-r -f environments/environment.local-pygrib.yml  # pygrib
#   conda env update -n wildfore-r -f environments/environment.hpc-cfgrib.yml    # cfgrib
#
# NOTE: channel_priority: strict keeps conda-forge and defaults from mixing
# GDAL/rasterio binaries, which can cause silent crashes (especially on Windows).
name: wildfore-r
channels:
  - conda-forge
  - defaults
channel_priority: strict
dependencies:
  - python=3.11

  # Core scientific stack (numpy pinned <2: the code is not numpy-2 ready)
  - numpy=1.26.4
  - scipy=1.17.0
  - pandas=3.0.0
  - scikit-learn=1.8.0
  - matplotlib        # not on the training cluster (plots are made locally); unpinned

  # Geospatial / raster
  - rasterio=1.4.3
  - geopandas=1.1.3
  - pyproj=3.7.2
  - xarray=2026.2.0
  - netCDF4=1.7.4
  - pillow            # cluster uses the Pillow-SIMD variant; standard pillow is fine, unpinned

  # Data download
  - cdsapi=0.7.7
  - ecmwf-api-client=1.6.5
  - requests=2.32.5
  - boto3=1.42.70     # AWS S3 access (s3fs backend for GOES GLM)
  - s3fs=2026.3.0     # S3 filesystem interface (GOES-16/17/18 GLM lightning)
  - earthaccess=0.17.0  # NASA Earthdata download (MODIS NDVI + SRTM slope)
  - pyhdf=0.11.6      # HDF4 reader (MODIS MOD13A2 format)

  # Utilities / dev
  - pyyaml=6.0.3
  - tqdm=4.67.3
  - psutil=7.2.2
  - pytest=9.0.3

  - pip
  - pip:
    # PyTorch. Plain pip installs a CPU wheel from PyPI; for a GPU build,
    # instead run (after creating the env):
    #   pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cu124
    # (torchvision / torchaudio are not used by this codebase.)
    - torch==2.10.0
